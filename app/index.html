  navigator.serviceWorker.register('sw.js', { updateViaCache: ahorroDatos ? 'all' : 'none' });
  function forzarUpdate() {
    var jobs = [navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })];
    if ('caches' in window) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return (k === 'viajes-fotos' || k === 'viajes-cfg') ? null : caches.delete(k); })); }));

  function aviso() {
