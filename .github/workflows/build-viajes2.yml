# build-viajes2 — cada push que toque viajes-2/src (ediciones del YAML desde
# el frontend vía contents API, o a mano) reconstruye las páginas y publica
# /viajes2 en este mismo repo: Pages lo sirve solo. Sin PAT: el GITHUB_TOKEN
# del repo alcanza porque todo vive aquí.
name: build viajes2

on:
  push:
    branches: [main]
    paths:
      - 'viajes-2/src/**'
      - 'viajes-2/build/**'
  workflow_dispatch:

concurrency:
  group: build-viajes2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: build + verify (round-trip)
        run: |
          cd viajes-2
          python build/build_itinerario.py 2026-Japon
          python build/build_mapa.py 2026-Japon
      - name: publicar /viajes2
        run: |
          cp -r viajes-2/pages/2026-Japon/. viajes2/
          git config user.name "viajes-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viajes2 viajes-2/pages
          git diff --cached --quiet || git commit -m "build: viajes2 desde viajes-2/src"
          git push
