  shinsekai: {nombre: Shinsekai, gps: '34.651601,135.505956', maps: 'https://www.google.com/maps/search/?api=1&query=34.651601,135.505956', descripcion: 'El barrio retro de Osaka: farolitos, kushikatsu, pachinkos y la torre Tsūtenkaku al centro. ''El Nuevo Mundo'' que se quedó congelado a mitad del siglo XX — hoy es puro encanto.', informacion: 'Se diseñó en 1912 mitad París, mitad Coney Island; tras la guerra decayó por décadas y ese abandono le dejó la estética que hoy lo hizo famoso.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkm2eOrtlQys2YBI4Yu8zv3JMejDOzOFYq3DheLqmoCzbumB9dJvHzIizf_8AF7KHMLzb5MvddjnxA5kiE8ltB35t19edjpQqOpqmu_XO4QCaJmiSegSvyvVSF5cDG4i0A-UXl_=w1200-h800'}
  tsutenkaku: {nombre: Tsūtenkaku, gps: '34.652499,135.506306', maps: 'https://www.google.com/maps/search/?api=1&query=34.652499,135.506306', descripcion: 'La torre de 103 m de Shinsekai: mirador, neones de anuncio y el dios Billiken — tócale los pies y pide un deseo.', informacion: La original de 1912 imitaba la Eiffel montada en un Arco del Triunfo; se fundió para acero de guerra en 1943. La actual (1956) es del mismo ingeniero que la Torre de Tokio., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWlPMbxxzmTov1G_pSvqfhjDipSapv_nF9-knJwQRnvJMR61eunirmFjHLCDKgExNgwS6h8GS6zXsTcYYUx5i8KI3U6QicbutMAeEJYv0BhSnAXcNL6ByqB7NBq6-FEJ2IzF4yKL=w1200-h800', horario: '09:00–21:45', horario_fuente: 'https://www.tsutenkaku.co.jp/annai/index.html'}
  parque-tennoji-keitakuen: {nombre: Parque Tennōji + Keitakuen, gps: '34.649657,135.511583', maps: 'https://www.google.com/maps/search/?api=1&query=34.649657,135.511583', descripcion: 'Parque urbano con el jardín japonés Keitakuen al centro: estanque, pinos podados y silencio — un respiro entre Shinsekai y Abeno.', informacion: 'El Keitakuen fue el jardín privado de la familia Sumitomo (diseño de Jihei Ogawa VII, el jardinero más famoso de su era) y se donó a la ciudad en 1926.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWnn43Z8XfQc5pOJCNpnTQVB52ERXl4D8ykGjMgObc54QkIQXTLoc83dft1Ss7FVknn1r56Z9ynSAVi_IvNQrkdjBeiiVFN4GJKtWG-D7pgBCDICLWk5S4gMZ41Xd3fvdxzVKrFBuiyqr19j=w1200-h800', horario: '09:30–17:00; Lun cerrado', horario_fuente: 'https://www.keitakuen-garden.jp/en/info'}
