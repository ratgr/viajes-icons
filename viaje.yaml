  mirador-del-gobierno-metropolitano: {nombre: Mirador del Gobierno Metropolitano, gps: '35.689733,139.691656', maps: 'https://www.google.com/maps/search/?api=1&query=35.689733,139.691656', descripcion: 'Las torres gemelas del gobierno de Tokio: mirador GRATIS en el piso 45 (202 m) — de noche, el mar de luces; en día claro, el Fuji.', informacion: Diseño de Kenzō Tange (1991) inspirado en Notre-Dame; fue el edificio más alto de Tokio hasta 2007 y costó tanto que lo apodaron 'la Torre de los Impuestos'., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWlYwshNthhiHDEJez44Z3qcCve6fT6PrXs8PCtL61949D_5OTuwsekHj5Q6_IgNm0PvZH6Z7kaohGS2uuS_gYjXsVbFFgWHiaCEkOLI6lw9_0T86dBHZwuKtDmTxho4VlME4UHAiywKt-s=w1200-h800', horario: 'Lun Cerrado; Mar–Dom 09:30–17:00', horario_fuente: 'maps'}
  omoide-yokocho: {nombre: Omoide Yokocho, gps: '35.693100,139.699499', maps: 'https://www.google.com/maps/search/?api=1&query=35.693100,139.699499', descripcion: '60 barras diminutas de yakitori apretadas en dos callejones con humo, faroles y bancos — el Tokio de 1950 intacto. ''El callejón de los recuerdos''.', informacion: Nació como mercado negro en 1946 sobre las ruinas del bombardeo; sobrevivió incendios y planes de demolición. Su apodo era 'Piss Alley' — no había baños., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWl98-QPwl1FZEiQu-_N62SECD9Szd4UTearq7llEjkKdQNQBkXKiIfGE6lL5VqTdCL-qT_qB1xYO5_XJ2jani3SlXkELN03So7qwtTGObubzmXeskL9xF_Uj6aPXHSuO6djVuHF=w1200-h800'}
