  royal-park: {nombre: Royal Park Canvas Kitahama, gps: '34.690921,135.506923', maps: 'https://www.google.com/maps/search/?api=1&query=34.690921,135.506923', imagen: fotos/royal-park.jpg, descripcion: 'Hotel base en Osaka — **4 noches** (dom 4 → jue 8). Kitahama, sobre el río, a 2 min de la estación Hankyu.', informacion: Check-in tomado desde la noche anterior (jugada de Juan) para entrar en cuanto lleguemos.}
  keio-prelia: {nombre: Keio Prelia Hotel Kyoto Karasuma Gojo, gps: '34.998307,135.759478', maps: 'https://www.google.com/maps/search/?api=1&query=34.998307,135.759478', descripcion: 'Hotel base en Kioto — **4 noches** (jue 8 → lun 12). Karasuma-Gojō, a 4 min de la estación Gojō (línea Karasuma).', informacion: 'El hotel que el Keep de Juan ya asume.'}
  rose-garden: {nombre: Hotel Rose Garden Shinjuku, gps: '35.694452,139.693706', maps: 'https://www.google.com/maps/search/?api=1&query=35.694452,139.693706', descripcion: 'Hotel base en Tokio — **6 noches** (lun 12 → dom 18). Nishi-Shinjuku, a 1 min de la estación Nishi-Shinjuku (salida 1).', informacion: 'Check-in desde las 15:00.'}
  castillo: {nombre: Castillo de Osaka, gps: '34.687257,135.525855', maps: 'https://www.google.com/maps/search/?api=1&query=34.687257,135.525855', imagen: fotos/castillo.jpg, descripcion: 'El símbolo de la ciudad: torre de 8 pisos entre fosos y murallas ciclópeas, rodeada de un parque enorme. El museo interior cuenta la era de los unificadores; la vista desde arriba abarca todo Osaka.', informacion: Lo levantó Toyotomi Hideyoshi en 1583 como el castillo más grande de Japón; ardió y cayó varias veces (la última en 1945). La torre actual es de 1931 — pionera del concreto armado en Japón., horario: '09:00–17:00 (últ. entrada 16:30); cierra 28 dic–1 ene · el parque es 24 h', horario_fuente: 'https://osaka-castle.org/hours-and-fees/'}
  namba-yasaka: {nombre: Namba Yasaka, gps: '34.661559,135.496704', maps: 'https://www.google.com/maps/search/?api=1&query=34.661559,135.496704', imagen: fotos/nambayasaka.jpg, descripcion: 'El santuario de la cabeza de león gigante: 12 m de fauces abiertas que se tragan la mala suerte. Foto obligada, visita de 20 minutos.', informacion: 'El santuario es antiquísimo, pero el escenario-león es de 1975: la boca "devora los malos espíritus" y atrae fortuna en los negocios.', horario: '06:30–17:00', horario_fuente: 'https://insideosaka.com/namba-yasaka-shrine/'}
  hozenji: {nombre: Hōzen-ji, gps: '34.667940,135.502468', maps: 'https://www.google.com/maps/search/?api=1&query=34.667940,135.502468', imagen: fotos/hozenji.jpg, descripcion: 'Templito escondido en un callejón empedrado: el buda Fudō Myōō está cubierto de musgo porque cada visitante le avienta agua al pedir su deseo.', informacion: Fundado en 1637; sobrevivió los bombardeos de 1945 que arrasaron el barrio. El buda lleva más de un siglo recibiendo agua — por eso el musgo.}
  dotonbori: {nombre: Dotonbori, gps: '34.669143,135.502709', maps: 'https://www.google.com/maps/search/?api=1&query=34.669143,135.502709', imagen: fotos/dotonbori.jpg, descripcion: 'El canal de neón más famoso de Japón: el corredor de Glico, el cangrejo gigante que se mueve, puestos, barcos y ruido feliz. De noche es otro planeta.', informacion: Nació en 1615 cuando el comerciante Dōton Yasui excavó el canal; en el periodo Edo se volvió el barrio de los teatros — de ahí la vocación de espectáculo.}
