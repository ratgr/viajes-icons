days:
- titulo: dom 4 · llegada + Osaka
  note: se llega VOLANDO — y con crucero reservado
  ancla: Dotonbori desde el río
  date: 2026-10-04
  steps:
  - {location: haneda-t3, time: '04:45', fixed: true, duration: 0, title: Aterrizan en Haneda (T3), note: 'Migración con el QR de Visit Japan Web listo, maletas, eSIM, yenes.

      Con 10: ~2 h. Desayuno 🏪: lo del avión + onigiri del 7-Eleven del pasillo.

      '}
  - {transit: haneda-t3-t2, mode: monorail, time: '07:00', duration: 10 min (o 15 a pie), title: '🚝 T3 → T2: monorraíl interno gratuito', color: '#8a7fb5', solo_seleccion: true, coords: '35.543913,139.768155 35.549000,139.775000 35.554000,139.781000'}
  - {transit: ana-checkin, mode: tramite, time: '07:15', duration: 1 h, title: 🧳 Documentar con ANA (20 kg incluidos) + seguridad, note: 'Con 10 personas, cuenta 1 h.', color: '#8a7fb5', solo_seleccion: true, coords: '35.554000,139.781000 35.554600,139.781600'}
  - {transit: flight-haneda-itami, mode: flight, time: '09:00', fixed: true, duration: 1 h 05, title: ✈️ Vuelo ANA NH17 → Osaka Itami, note: 'Aterriza 10:05. Pagado: $1,169 pp (conf. DRWRL6 / DLF2IW).', color: '#7b4fa6', solo_seleccion: true, coords: '35.543913,139.768155 34.786161,135.438048'}
  - {location: osaka-itami, time: '10:05', fixed: true, duration: 0, title: Llegada a Osaka Itami}
  - {transit: itami-monorail, time: '10:30', duration: 15 min, title: '🚇 Osaka Monorail (local Kadomashi): @[Osaka-kūkō → Yamada](itami-monorail)'}
  - {transit: yamada-hankyu, time: '10:50', duration: 25 min, title: '🚇 Hankyu Senri Line (transbordo en Yamada): @[Yamada → Kitahama](yamada-hankyu)', note: 'Entra directo a la @[línea Sakaisuji](sakaisuji) — reagrupe en el andén: el que se pierda, baja en Yamada y espera.'}
  - {transit: kitahama-hotel, duration: 2 min, title: 🚶 Kitahama → hotel}
  - {location: royal-park, time: '12:00', fixed: true, duration: 1 h 20, title: 'Check-in en el @[Royal Park Canvas](royal-park)', note: '**Check-in** — dejamos maletas y una **siesta de ~1 h**; luego salimos ligeros al Castillo.'}
  - {transit: hotel-temmabashi, time: '13:20', duration: 15 min, title: 🚶 Hotel → Temmabashi por la ribera, note: '5 min a **Temmabashi** por la ribera (o @[Tanimachi Line](tanimachi), 1 estación a Tanimachi 4-chōme).'}
  - {transit: temmabashi-castillo, duration: 25 min, title: 🚶 Temmabashi → Castillo (entra por el NORTE), note: ~20 min de parque hasta la torre; entramos por el norte para salir por el sur.}
  - {location: castillo, time: '14:15', fixed: true, duration: 2 h, title: '@[Castillo de Osaka](castillo) ★', note: 'Pase ya comprado (¥1,200): foso, parque y museo — 2 h.

      El interior es opcional según la pila.

      ', cost: '¥1,200'}
  - {transit: castillo-tanimachi, time: '16:15', duration: 25 min, title: 🚶 Castillo → Tanimachi 4-chōme (salida sur)}
  - {transit: metro-tanimachi, time: '16:40', duration: 5 min, title: '🚇 Tanimachi Line: @[Tanimachi 4-chōme → Tanimachi 9-chōme](metro-tanimachi)'}
  - {transit: metro-sennichimae, time: '16:45', duration: 5 min, title: '🚇 Sennichimae Line: @[Tanimachi 9-chōme → Namba](metro-sennichimae) (salida 14)'}
  - {transit: namba-nambayasaka, time: '16:50', duration: 15 min, title: 🚶 Namba → Namba Yasaka}
  - {location: namba-yasaka, time: '17:05', duration: 20 min, title: '@[Namba Yasaka](namba-yasaka) 🦁', note: La cabeza de león de 12 m que se traga la mala suerte — foto obligada.}
  - {transit: nambayasaka-hozenji, duration: 15 min, title: 🚶 Namba Yasaka → Hōzen-ji}
  - {location: hozenji, time: '17:40', duration: 15 min, title: '@[Hōzen-ji](hozenji) 🧿', note: El buda de musgo — le avientas agua y pides deseo. Callejón empedrado.}
  - {transit: hozenji-pier, time: '19:00', duration: 10 min, title: 🚶 Al embarcadero Tazaemon-bashi (junto al Don Quijote)}
  - {location: dotonbori, time: '19:30', fixed: true, duration: 20 min, title: '@[CRUCERO por el río Dotonbori](dotonbori)', note: 'Reservado ($215 pp): embarcadero Don Quijote (Tazaemon-bashi),

      **presentarse 19:10**. 20 min de neón desde el agua.

      ', cost: USD 215 pp}
  - time: '20:00'
    duration: 1 h 30
    title: Cena callejera en Dotonbori
    note: 'Sin conmutación — del barco directo al ruido. 1 h 30 sin reloj.

      Punto de reunión: el letrero de **Glico** a las 21:30.

      '
    retorno: true
    options:
    - title: Take
      class: take-container
      options:
      - {location: acchichi, precio: ¥600}
      - {location: kinryu, precio: ¥900}
      - {location: ichiran-do, precio: '¥980-1,320'}
    - title: Ai
      class: ai-container
      options:
      - {location: mizuno, precio: '¥1,600'}
      - {location: chibo, precio: '¥2,000'}
      - {location: daruma-do, precio: '¥2,500'}
    - title: Shu
      class: shu-container
      options:
      - {location: hariju, precio: '¥7,000-10,000'}
      - {location: kani-douraku, precio: '¥6,000-12,000'}
      - {location: mgyu-do, precio: '¥8,000-12,000'}
  - {transit: metro-midosuji, time: '21:45', duration: 10 min, title: '🚇 Midosuji Line: @[Namba → Yodoyabashi](metro-midosuji)'}
  - {transit: yodoyabashi-hotel, time: '22:00', duration: 10 min, title: 🚶 Yodoyabashi → hotel por la ribera, note: '🏪 Aviso mañana: el buffet abre 6:30 y SÍ alcanza — konbini solo de respaldo. El tren NO espera.'}
- titulo: lun 5 · Hiroshima + Miyajima
  note: el tren ya está pagado — Miyajima AM, la Paz PM
  ancla: el torii flotante
  date: '2026-10-05'
  steps:
  - {time: '06:00', title: '**Arriba** — desayuno exprés 🏨 6:30–6:55 (el buffet del Canvas abre 6:30); 🏪 konbini de respaldo.'}
  - {transit: d5-1, time: '07:00', fixed: true, title: '🚇 Salida EN PUNTO (regla ★ de Juan): 6 min a pie a **Yodoyabashi**.'}
  - {transit: d5-2, time: '07:10', title: '🚇 @[Midosuji Line](d5-2) (local Shin-Osaka), 4 estaciones — 9 min; al andén del shinkansen con 15 de colchón.'}
  - {transit: d5-3, time: '07:34', fixed: true, title: '**@[Shinkansen](d5-3) a Hiroshima** — pagado vía Klook (¥9,890 pp): llega 9:04. Asientos asignados, nadie corre.'}
  - {transit: d5-4, time: '09:10', title: '🚇 @[JR San-yo Line](d5-4) (local Iwakuni), andén 1 — 28 min a **Miyajimaguchi**.'}
