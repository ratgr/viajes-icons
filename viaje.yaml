  fushimi-inari: {nombre: Fushimi Inari, gps: '34.967695,135.779188', maps: 'https://www.google.com/maps/search/?api=1&query=34.967695,135.779188', descripcion: 'Miles de torii bermellón trepando el monte Inari en túneles infinitos — el lugar más fotografiado de Japón. Hasta el mirador Yotsutsuji: ~45 min de subida.', informacion: 'Cabeza de los ~30,000 santuarios Inari del país, fundado en 711. Cada torii es donado por una empresa pidiendo prosperidad; los zorros son los mensajeros del dios del arroz.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkKghXQfKYWxHH-x8YgiXww9Ky9dJ9OlFui-kKyKOkLHrFCke9S_-gEmKpfxVL-vzbUHxOxLIUUbomGvCFUmx9U_a3FZjpHoZ5BSGApxa-k9ALYskhvi3EfXyEizd2VtrHh_MDw=w1200-h800', horario: '24 h', horario_fuente: 'https://inari.jp/en/'}
  pabellon-dorado-kinkaku-ji: {nombre: Pabellón Dorado (Kinkaku-ji), gps: '35.039370,135.729243', maps: 'https://www.google.com/maps/search/?api=1&query=35.039370,135.729243', descripcion: El pabellón forrado de ORO de verdad reflejándose en su estanque — no existe la foto mala. Paseo circular de ~45 minutos., informacion: Villa del shōgun Yoshimitsu (1397) vuelta templo. Un monje novicio lo INCENDIÓ en 1950 (Mishima escribió la novela); la reconstrucción de 1955 lleva 20 kg de oro., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWn_XrNPCa_95k1D1VWwarYtM4snAWPWmFjikClXfPNhVKKId3R8lFBzDtK6Wb2P-aeIkL5yGmUTloqVp2KDe_Rv2Ia1rRzCvydosjVT1e4y_XOLF908CUxjzSoTUY0YaQmq11-yGQ=w1200-h800', horario: '09:00–17:00', horario_fuente: 'https://www.shokoku-ji.jp/kinkakuji/'}
