  isla-de-miyajima: {nombre: Isla de Miyajima, gps: '34.273211,132.305249', maps: 'https://www.google.com/maps/search/?api=1&query=34.273211,132.305249', descripcion: 'La isla sagrada frente a Hiroshima: el torii flotante, venados sueltos, la calle Omotesando con momiji manju y ostras a la parrilla, y el monte Misen detrás.', informacion: 'Isla-dios desde el siglo VI: por siglos estuvo prohibido nacer y morir en ella — la gente cruzaba a tierra firme para ambas cosas.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWm89Dg3mPnpDA2T5U8gX_MFFmTSwVhAnNlK-ju1ZB5stLXwvE27W4I21zhKkYIluRh7FymKMab6qlnHYf9KQkfBEtGqjEYGIcswQmViC5s8D9sJRNMwa7EOEquqtagrWgYXhy8=w1200-h800'}
  santuario-itsukushima: {nombre: Santuario Itsukushima, gps: '34.295990,132.319828', maps: 'https://www.google.com/maps/search/?api=1&query=34.295990,132.319828', descripcion: 'El santuario sobre pilotes que ''flota'' en marea alta, con su torii bermellón de 16 m plantado en el mar — Patrimonio UNESCO.', informacion: 'Le dio su forma actual Taira no Kiyomori en 1168. El torii actual (1875) es el octavo — se sostiene por puro peso propio, sin cimientos enterrados.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmgcFh5v18R6K-renfIM3i5EXtMcfBLQGaC22I6pQ9vU0YQQfpUqYbqA72lTnSoRpnfD4SmCUV8Z28U6bJ8xu4YWoFq3DUEZ27s05ivM57gr0xhq0LjNWGj_IbYEQ9qmCPYT6-H=w1200-h800', horario: '06:30–18:00', horario_fuente: 'maps'}
  parque-memorial-de-la-paz: {nombre: Parque Memorial de la Paz, gps: '34.392687,132.452201', maps: 'https://www.google.com/maps/search/?api=1&query=34.392687,132.452201', descripcion: 'El parque en el hipocentro: el Domo, el cenotafio, el museo, las mil grullas de Sadako y la llama que no se apagará hasta que desaparezca la última arma nuclear.', informacion: 'Aquí estaba el corazón comercial de Hiroshima. Tras el 6 de agosto de 1945 se decidió no reconstruirlo, sino dedicarlo entero a la paz — diseño de Kenzō Tange, 1954.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWl_p5pIBAoTrlaZ_74lwEKwyEYk2mEECH9r43vrhbqc0gDLeSfqsBXN2_C-vpuV7PgzqeaF5u5sQGXAo5T4XuZijWgbbCMFllF3kK6jnsRbbyF4szVdCTF1LDi_-7xuZAdJniiS=w1200-h800', horario: '24 h', horario_fuente: 'maps'}
  domo-de-la-bomba-atomica: {nombre: Domo de la Bomba Atómica, gps: '34.395483,132.453592', maps: 'https://www.google.com/maps/search/?api=1&query=34.395483,132.453592', descripcion: 'El esqueleto del antiguo Palacio de Exposiciones, dejado EXACTAMENTE como quedó — el edificio en pie más cercano al hipocentro.', informacion: 'La bomba estalló casi encima de él, a 160 m de altura — por eso sus muros aguantaron. Es UNESCO desde 1996: testigo, no monumento.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWln153rVFK6XjSHJ_7CGdnOeFGWPqmbOYfAFLx58U83e7lXLVQwKAdMuy0v_9ASp2SaRd6nt1jW4O9j60gmrOpd2q6fPDP1uroollE9geSSbqcUjiVOvrOil3lfhL_ECbm6vj2S=w1200-h800'}
