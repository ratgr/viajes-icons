  bosque-de-bambu: {nombre: Bosque de bambú, gps: '35.016819,135.671301', maps: 'https://www.google.com/maps/search/?api=1&query=35.016819,135.671301', descripcion: 'El túnel de bambúes de 20 m que se mecen y suenan — ese sonido está catalogado como patrimonio sonoro de Japón. Temprano es un templo; a las 10 am, un andén del metro.', informacion: 'Los bosques de Sagano abastecían de bambú a la corte y a los templos zen desde el periodo Heian, cuando Arashiyama era el retiro campestre de los nobles.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWlSN0NZkIHxq4vZIS_sg7SpH2Epq5MqrVOBjS5T32VLCiXcN0Tp2Q1NmBTxlR0LSJwFtURVfhU8PY7REIXsaMrQGRzXI6ChkTJqauKFdBH44_-1lbVPy_ejmW1iR5sVT6-YCiSTMQ=w1200-h800'}
  puente-togetsukyo: {nombre: Puente Togetsukyō, gps: '35.012877,135.677775', maps: 'https://www.google.com/maps/search/?api=1&query=35.012877,135.677775', descripcion: '''El puente que cruza la luna'': 155 m sobre el río Katsura, con el monte Arashiyama encendido de colores detrás.', informacion: Existe desde el año 836; el nombre se lo puso el emperador Kameyama al ver la luna 'cruzarlo' una noche. La versión actual (1934) es concreto disfrazado de madera — y nadie lo nota., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmYmYeNvgf2k8LMyVjKepeNja3Ii4bWACR9NbwdVeb9LUUAPB2qV7iFYOvmQsElxGESPJ7ysvXK50TaA1fC7D-DYsxQYorSdQdr65WJps7_kVvGX5M4WW7D5JdI8_5ztLfCb5hPzw=w1200-h800'}
  tenryu-ji: {nombre: Tenryū-ji, gps: '35.015838,135.673765', maps: 'https://www.google.com/maps/search/?api=1&query=35.015838,135.673765', descripcion: 'El gran templo zen de Arashiyama: su jardín del estanque Sōgenchi lleva 700 años EXACTAMENTE igual, con las montañas ''prestadas'' como fondo. UNESCO.', informacion: 'Lo fundó el shōgun Ashikaga Takauji en 1339 para apaciguar el espíritu de su enemigo, el emperador Go-Daigo. El jardín de Musō Soseki es el original: primer Sitio Histórico Especial de Japón.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWntZR9fCzS2UAjbrZiIkZvjD_7bt9TnCjjmCapjgd8u7sz2PRIWFoxbMJmgdBI_U0IUBsABSCjyOM_et5F3mvSfMCJsqKcwealM8wt_BqDwHNB6tU3a45V2dU-2R6Xbw1fYetO6gypNA-w=w1200-h800', horario: '08:30–17:00', horario_fuente: 'https://www.tenryuji.com/en/visit/'}
  monte-de-los-monos-iwatayama: {nombre: Monte de los monos (Iwatayama), gps: '35.011395,135.676625', maps: 'https://www.google.com/maps/search/?api=1&query=35.011395,135.676625', descripcion: '120 macacos japoneses libres en la cima: subes 20 minutos y ELLOS te observan a ti — con la mejor vista panorámica de Kioto de regalo.', informacion: 'Opera desde 1957 al estilo ''monte de alimentación'': los monos son salvajes y bajan por voluntad. Adentro de la cabaña los enjaulados son los humanos — los monos quedan afuera.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWlilm-kVMEK4_eL3_V_9STfYr7zeqhLd2RSdn20-odPX24BGQNXAhgMxdK3QqoOWUrDtzuiLYTJo7tzZVbtYYW_kH1usuTZyA3EVG2KW0ikt7Lcfx1UT2ZSKp_DKEAcKO7lc_Q=w1200-h800', horario: '09:00–16:30', horario_fuente: 'https://www.insidekyoto.com/arashiyama-monkey-park'}
  otagi-nenbutsu-ji: {nombre: Otagi Nenbutsu-ji, gps: '35.031143,135.661555', maps: 'https://www.google.com/maps/search/?api=1&query=35.031143,135.661555', descripcion: '1,200 rakan (discípulos de Buda) de piedra, cada uno con cara distinta: uno ríe, otro bosteza, uno carga un gato, otro un walkman. El rincón más encantador y menos visitado de Kioto.', informacion: 'El templo es del siglo VIII, pero las estatuas son de 1981–1991: las tallaron 1,200 aficionados guiados por el escultor-monje Kōchō Nishimura durante la restauración.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmzqbshOv3gAFQD4BsyvsFnGoWeEGYjXj2-c2gJgGzS20B_qa9bXtjJHw1hvGr01qfDM8Ge5FV_80Sl-5gnmhVLk6VeKgVL-VUDOHaO3t6wvH_0S828Pv7qbMgXL3CGSgRrHmwaNOrT8CH5=w1200-h800', horario: '09:00–16:15; Mié cerrado', horario_fuente: 'https://www.otagiji.com/visit-en'}
