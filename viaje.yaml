  kiyomizu-dera: {nombre: Kiyomizu-dera, gps: '34.994666,135.784661', maps: 'https://www.google.com/maps/search/?api=1&query=34.994666,135.784661', descripcion: 'El templo del balcón: una terraza de madera colgada sobre el valle, sostenida por 168 pilares SIN un solo clavo, con Kioto entero de fondo.', informacion: 'Fundado en 778 junto a la cascada Otowa (''agua pura'' = kiyomizu). El dicho ''aventarse del balcón de Kiyomizu'' equivale a nuestro ''echarse al ruedo'': 234 personas saltaron en el periodo Edo.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWnlR5OYbI7E7mMSdtr1TN6lq9l2llRXO9N0bzic1Q2dSpEM2l9mKfWDLYPue0aoDTtRsyUCiwZcO7npvt0wiTgD7RABpGrZiv5O-N4Prrlpsr7j4zFMQw2oZbaxZN43xpBXardq9t5Ydg4=w1200-h800', horario: '06:00–18:00', horario_fuente: 'https://www.kiyomizudera.or.jp/news/open-hour.php'}
  sannenzaka-y-ninenzaka: {nombre: Sannenzaka y Ninenzaka, gps: '34.996664,135.781008', maps: 'https://www.google.com/maps/search/?api=1&query=34.996664,135.781008', descripcion: 'Las dos cuestas empedradas más bonitas de Japón: machiya de madera, cerámica, dulces y faroles — el Kioto de postal.', informacion: 'Camino de peregrinos hacia Kiyomizu desde el siglo IX. La superstición: tropezar en Ninenzaka trae 2 años de mala suerte — y 3 en Sannenzaka.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWlw72Qq35PRrB3egZK4nSh2hJYQBs0LsRkNTUkDaNVNIt8H7PKQ4KaJBI0uF4al2G2v7Q7I8v4Gx3cDqpN6z3i8mtn_Ds0vY3Hp-VWxFb-2vQvy6invoIH7N7QQNMW5Nv-4CvvU7cFNMCc=w1200-h800'}
  pagoda-yasaka-hokan-ji: {nombre: Pagoda Yasaka (Hōkan-ji), gps: '34.998558,135.779236', maps: 'https://www.google.com/maps/search/?api=1&query=34.998558,135.779236', descripcion: '46 m de madera del siglo XV emergiendo entre callejones — LA foto de Kioto, sobre todo con la luz del atardecer.', informacion: Su fundación se atribuye al príncipe Shōtoku en 589. La torre actual es de 1440 y es de las poquísimas pagodas de Japón que dejan subir adentro., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWk2_E-n9caMXR2nU5pZXuX0c0tbJY1tFATKowRPz43Z2fWEu31fke-7y0T9nR19JK37VQcDpVdQp9km3WkMsw-XTQ0AMzBqK7K_LqgOXR8H-etTMWvqM_qgyaNd79Cg3c1zOgjdHA=w1200-h800', horario: '10:00–15:00', horario_fuente: 'https://www.gltjp.com/en/directory/item/17413/'}
  santuario-yasaka: {nombre: Santuario Yasaka, gps: '35.003656,135.778553', maps: 'https://www.google.com/maps/search/?api=1&query=35.003656,135.778553', descripcion: 'El santuario de Gion: linternas que se encienden al anochecer, puertas bermellón, y el paso natural entre el barrio de las geishas y el parque Maruyama.', informacion: 'Fundado hace ~1,350 años. Su festival — el Gion Matsuri, julio — nació en 869 como plegaria contra una epidemia y es el festival más famoso de Japón.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWk-0HEcxTfpCTC7EnglGoZHG_UCyb_qTxOWxFd7gWUr7deBTMnPG3UvDeOzsFir8jBCj80WOrefq502HYfMTiXWtHuDEj2zMellUAUIC-1bRaKAGtpzGD5Gd_ANozVL21m6IWgy5w=w1200-h800', horario: '24 h', horario_fuente: 'maps'}
  ryozen-kannon: {nombre: Ryōzen Kannon, gps: '34.999902,135.781907', maps: 'https://www.google.com/maps/search/?api=1&query=34.999902,135.781907', descripcion: La Kannon blanca de 24 m que vigila Higashiyama desde la ladera — casi nadie entra y es serenísima., informacion: 'Construida en 1955 en memoria de los caídos de la Segunda Guerra Mundial — de ambos bandos: adentro hay placas por los soldados aliados también.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmKjqnewome--hr1-3tqM_1OSv2ZTWfi-vHfT6rzXMsK9DCFMssqK9kU6XDEadJ2N8vZBCD6N-CKOlPk6aK04MnOSN7jri6GdNMMwoDPwS1g3MUvdBuj4iliaZkeQAyZytFOhmDFA=w1200-h800', horario: '08:40–16:20', horario_fuente: 'http://www.ryozen-kwannon.jp/indexE.html'}
  gion: {nombre: Gion, gps: '35.003782,135.777245', maps: 'https://www.google.com/maps/search/?api=1&query=35.003782,135.777245', descripcion: 'El barrio de las geishas: casas de té de madera, las calles Hanamikoji y Shirakawa, y al anochecer, geiko y maiko yendo a sus citas.', informacion: Creció en el siglo XVII alrededor del santuario Yasaka para atender peregrinos; las casas de té más antiguas siguen operando solo por invitación., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmsjMa-GO7CGZWJkIRfQY5yrNbGoJD-4xJE0AJwkaHMbj3NW8qhqum4qvj_cP2RG4VDQCnwBX0KUjIMMMlGegv04-IeeHv4aOnJ5ov7twbdheXEasJZjIL9Q3JZO5-xk67o6AOx=w1200-h800'}
  sanjusangen-do: {nombre: Sanjūsangen-dō, gps: '34.987884,135.771713', maps: 'https://www.google.com/maps/search/?api=1&query=34.987884,135.771713', descripcion: 'Un salón de 120 m con 1,001 Kannon doradas en formación más 28 guardianes — la sala de madera más larga de Japón. Impacta en silencio absoluto.', informacion: 'De 1164 (reconstruido en 1266). ''33'' (sanjūsan) son los intervalos entre columnas y las formas en que Kannon puede manifestarse. A lo largo del salón se tiraba con arco: el torneo Tōshiya.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWlw72Qq35PRrB3egZK4nSh2hJYQBs0LsRkNTUkDaNVNIt8H7PKQ4KaJBI0uF4al2G2v7Q7I8v4Gx3cDqpN6z3i8mtn_Ds0vY3Hp-VWxFb-2vQvy6invoIH7N7QQNMW5Nv-4CvvU7cFNMCc=w1200-h800', horario: '08:30–17:00', horario_fuente: 'maps'}
