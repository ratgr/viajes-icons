  torre-de-tokio: {nombre: Torre de Tokio, gps: '35.658580,139.745433', maps: 'https://www.google.com/maps/search/?api=1&query=35.658580,139.745433', descripcion: La torre roja y blanca de 333 m — 9 m más alta que la Eiffel que imita — con mirador a 150 m y un cariño de los tokiotas que el Skytree no le quita., informacion: 'De 1958, símbolo del renacimiento de posguerra: un tercio de su acero vino de tanques estadounidenses fundidos tras la guerra de Corea.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWnuqMHhe0XYNwC48OdIcds_ZEFoKUKx1e1c2LL5_1MzlUx1XfDL29XtRMSssmflspg6aBXLpJZB_-R1U9Zo9-KrKViUgEkv1MO16POjofWWNpWaM9SQ8Ztd2rBVPcqrkmVLJt_v=w1200-h800', horario: '09:00–23:00', horario_fuente: 'https://en.tokyotower.co.jp/'}
  zojo-ji: {nombre: Zōjō-ji, gps: '35.657479,139.748293', maps: 'https://www.google.com/maps/search/?api=1&query=35.657479,139.748293', descripcion: 'El gran templo a los pies de la Torre de Tokio: la puerta Sangedatsumon (1622) y las filas de jizō con gorritos rojos que conmueven.', informacion: 'Templo funerario de los Tokugawa: seis shōguns descansan aquí. Su puerta principal es de las estructuras de madera más antiguas de Tokio — sobrevivió terremoto y bombardeos.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWlxni10BWPQ1Vn-RoYkJSW0dZT0h3Z9u_66kMcyHr65V1H0Ul5lL4Ce6S3ug0Cp_yc716LAdXwEytA8JVcZ4pzrCtvZXpRIJvMZpfwG1ld8QxNX1yqHbMhXmVwNYm1zfgLzlS_W=w1200-h800', horario: '06:00–17:30', horario_fuente: 'https://www.zojoji.or.jp/en/'}
