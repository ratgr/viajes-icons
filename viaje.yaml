  teleferico-de-hakone: {nombre: Teleférico de Hakone, gps: '35.244427,139.015041', maps: 'https://www.google.com/maps/search/?api=1&query=35.244427,139.015041', descripcion: 'Cabinas cada minuto cruzando sobre el valle volcánico, con el Fuji apareciendo a la derecha si el cielo abre.', informacion: Opera desde 1959 (cabinas suizas renovadas en 2020) y es de los teleféricos más transitados del mundo., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkdI-6og8gNPkwxa6LRL1_VT3GMpP_i8LrWnOJebYkMjnRdfzy3fu2_YkQLQgHa-CPN-6mAg3oMvyFwK6sAD0NmOZBAFR4WbAfX2ojyLk7K_eEeCKRHvqF8YOaQMMqxQha5PN3O=w1200-h800', horario: 'Feb–Nov 09:00–16:45; Dic–Ene 09:00–16:15', horario_fuente: 'https://www.hakoneropeway.co.jp/foreign/en/'}
  owakudani: {nombre: Ōwakudani, gps: '35.243449,139.019354', maps: 'https://www.google.com/maps/search/?api=1&query=35.243449,139.019354', descripcion: 'El ''Gran Valle Hirviente'': fumarolas, olor a azufre y los huevos negros cocidos en las pozas — la leyenda dice que cada uno alarga la vida 7 años.', informacion: 'Es la cicatriz de la última gran erupción del Hakone, hace ~3,000 años; los huevos se ennegrecen por el hierro y el azufre del agua termal.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmwgEyTmMuo-uIgBBkeXP66lX_0BRKgmgcDxVQYBf8WLsDpsyqz8CwyAia9bgVx_s76cYhoOobFIxMDoul3kN-5BK8xEHAeL6FG5JWDybKbU2AZJgB5AJsMddUC7ioNFSxQfUZY671bjHAN=w1200-h800', horario: '09:00–17:00', horario_fuente: 'https://hakone-japan.com/discover/national-park/area-information/owakudani/'}
