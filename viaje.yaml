  castillo-de-nijo: {nombre: Castillo de Nijo, gps: '35.014038,135.748426', maps: 'https://www.google.com/maps/search/?api=1&query=35.014038,135.748426', descripcion: 'El castillo-palacio del shōgun en Kioto: pisos ''de ruiseñor'' que chirrían a propósito para delatar intrusos, puertas doradas y jardines. UNESCO.', informacion: 'Lo construyó Tokugawa Ieyasu en 1603 para vigilar a la corte. Aquí mismo, en 1867, el último shōgun devolvió el poder al emperador — el fin de 265 años de shogunato, en su propia sala.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmQtzdcZDA91kiSbfpgmIwKEbhI1gtOFpkvgONsVFbnoAeABm7jGg18rjS14oBDKoW6zPq1cMWp3F-WGGIEvDX3xnG2ijFxiVr2aICODIP5G_m_aaRvY6BljxOa5rS_guQ8z6VH=w1200-h800', horario: '08:45–17:00', horario_fuente: 'maps'}
  palacio-imperial-de-kioto: {nombre: Palacio Imperial de Kioto, gps: '35.024098,135.762144', maps: 'https://www.google.com/maps/search/?api=1&query=35.024098,135.762144', descripcion: 'El palacio de los emperadores durante 500 años: salones ceremoniales, puertas según rango y jardines de paseo, en un parque enorme y gratuito.', informacion: 'La corte vivió aquí de 1331 a 1869, cuando Meiji se mudó a Tokio. El edificio actual es de 1855 y el salón Shishinden se sigue usando para entronizaciones.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmFLa6oBA2HYMve2KRKl7THj7x_CoDYHwQK8OM0krYnSRKebcRwnSq9mHSg5835qNsnEEjlXmlcZ1wQjUQ5oz-_v_DrrKBZiIS91A4bzueEQ6Eo-b1uKGcQHkG0pxdfQL1a8zvxDA=w1200-h800', horario: 'Abr–Ago 09:00–17:00; Sep/Mar 09:00–16:30; Oct–Feb 09:00–16:00; cierra lunes', horario_fuente: 'https://sankan.kunaicho.go.jp/multilingual/lang/en/information.html'}
