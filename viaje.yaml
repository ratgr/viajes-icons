  universal-studios-japan: {nombre: Universal Studios Japan, gps: '34.665677,135.432319', maps: 'https://www.google.com/maps/search/?api=1&query=34.665677,135.432319', descripcion: 'El parque de Universal en Osaka: Nintendo, Harry Potter, Minions, Jaws — y en octubre, ambientación de Halloween. La fila temprana es LA estrategia.', informacion: Abrió en 2001 como el primer parque Universal fuera de Estados Unidos; hoy está entre los 5 parques más visitados del mundo., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmUfxK9ULcmBBSgYS1v8-e-_iPVc88k8UXAPFMJylP7Zj-U_2t6TT5IpHBkCrVkIBVHI1Dw-KG9mZbe-_v037WgrjtGp3lQc3s9uo_sB2bbVBMMqf7M2iI6uApta6AE1H8GXQ6j=w1200-h800', horario: '~09:00–21:00 (varía por fecha)', horario_fuente: 'https://www.usj.co.jp/web/en/us'}
  super-nintendo-world: {nombre: Super Nintendo World, gps: '34.667966,135.430323', maps: 'https://www.google.com/maps/search/?api=1&query=34.667966,135.430323', descripcion: 'El mundo de Mario a escala real: entras por un tubo warp, los bloques suenan al golpearlos, Mario Kart es un ride con realidad aumentada y la Power-Up Band convierte el área entera en videojuego.', informacion: Abrió en 2021 tras una inversión de ~60 mil millones de yenes — la primera vez que Nintendo dejó que su universo se pudiera pisar.}
  parque-de-nara: {nombre: Parque de Nara, gps: '34.685047,135.843012', maps: 'https://www.google.com/maps/search/?api=1&query=34.685047,135.843012', descripcion: 'El parque donde ~1,300 venados sika viven sueltos y hacen reverencia pidiendo galletas (shika senbei, ¥200). Entre ellos: templos, museos y céspedes infinitos.', informacion: 'Los venados son sagrados desde el año 768: la leyenda dice que el dios Takemikazuchi llegó a Nara montado en un venado blanco. Dañarlos fue delito capital durante siglos.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkz_MDZClObB0RbrZtSC_67CeC3qacEsAeuWm-9JM6AbcAAEvY5OOE22fbQAZWFXjHCY7XmTYzqLP_xVk9FU9vpR1etq_k5ut4o8SsmH5Ph3he6xVLHqmfgVebWmNVXHMvYXVwrEf4sfXo-=w1200-h800', horario: '24 h', horario_fuente: 'maps'}
  todai-ji: {nombre: Tōdai-ji, gps: '34.688985,135.839816', maps: 'https://www.google.com/maps/search/?api=1&query=34.688985,135.839816', descripcion: 'El Gran Buda: 15 m de bronce sentado dentro de uno de los edificios de madera más grandes del mundo. Cruzar la puerta y verlo quita el aliento.', informacion: 'Se fundió en 752 y agotó casi todo el bronce disponible en Japón. El salón actual (1709) es dos tercios del original — y aun así, inmenso.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmBAnqhacKBGVopsmC57CB-NARM7ALw51N9vHlEZwfH0aC9ANEvhflxWT36d-cNn_2hzIDsQ8LLYq9xL_QXy5szdf8pO-ixSPDJMdtxNwZo3DiyfYwJewjJj3s4M_sdsCb-kmR-Zg=w1200-h800', horario: '07:30–17:30', horario_fuente: 'maps'}
  kasuga-taisha: {nombre: Kasuga Taisha, gps: '34.681545,135.848472', maps: 'https://www.google.com/maps/search/?api=1&query=34.681545,135.848472', descripcion: 'El santuario de las 3,000 linternas: piedra cubierta de musgo en el sendero, bronce dorado colgando de los pasillos bermellón.', informacion: Fundado en 768 por el clan Fujiwara; por la idea sintoísta de renovación se reconstruyó idéntico cada 20 años durante siglos., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkNiJjX8RTU6yEQYHHfGpJndYnJg1PmbVhGQF5TBo5iBrJ5Sn09HvmJbB7FHMPqLFO8KD6Qtqo6jW-otoWKOFa7QxoT7IvTN6qyAyTev0kT92TbXF186pB1gEbvxa0tLoS1MWxhO5Ij02DU=w1200-h800', horario: '07:00–17:00', horario_fuente: 'maps'}
  kofuku-ji: {nombre: Kōfuku-ji, gps: '34.683231,135.831159', maps: 'https://www.google.com/maps/search/?api=1&query=34.683231,135.831159', descripcion: 'La pagoda de 5 pisos que es el ícono de Nara (50 m, la segunda más alta de Japón), con salones llenos de budas Tesoro Nacional.', informacion: Templo-poder de los Fujiwara desde 710; llegó a tener ejércitos de monjes guerreros que atemorizaban a la propia corte imperial., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWnfipd6_HLRCzl-EJqwpRMMIQLzUA-TmE3K6xkbTED3X8OZAIZ2yKO6nc09DBBg4oxSm2-xoOTxxF4gFUl8cqEbGVtaXmRqS_pND2-5F_HVRY6c0ojfGnSqtl1X19rSvtDEMHozRQ=w1200-h800', horario: '09:00–17:00', horario_fuente: 'maps'}
  naramachi: {nombre: Naramachi, gps: '34.676001,135.834834', maps: 'https://www.google.com/maps/search/?api=1&query=34.676001,135.834834', descripcion: 'El casco viejo de casitas de madera (machiya): tiendas artesanales, cafés en patios y los monitos rojos colgantes que protegen las casas.', informacion: Era el distrito comercial que creció alrededor del templo Gangō-ji (UNESCO); muchas machiya operan igual desde el periodo Edo., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWlsAoqBr61xFuLBnSf1zZgkcMO_y_I97AOeNhO1Nf0sQi_7gMrEiSGAfozjSqdAgcsWvLodwfG9-uXhSABuoG1LQH6rRj1n2BPCbAY5Amwwe_pGVMeTWVa43kLrxZQ17Xu2XQ4c=w1200-h800'}
  jardin-yoshikien: {nombre: Jardín Yoshikien, gps: '34.685476,135.836310', maps: 'https://www.google.com/maps/search/?api=1&query=34.685476,135.836310', descripcion: 'Tres jardines en uno — musgo, estanque y casa de té — gratis para visitantes extranjeros y casi siempre vacío.', informacion: Ocupa el terreno de las antiguas residencias de los sacerdotes de Kōfuku-ji; su jardín de musgo es de los mejores fuera de Kioto., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkDgCPq4fVGgX_g2JkQL3bn3GvtLatT92jXvyf_OAR_iZ2ZcirrNI8ULjz33cLC3MXwfOvOprEApXLsL6wQM7q1xxIk_AxZId86UFOmo3GdiEtAzQmf1A43cR2k7Ai8JEq50y2JpS-QWx7F=w1200-h800', horario: '09:00–17:00', horario_fuente: 'maps'}
