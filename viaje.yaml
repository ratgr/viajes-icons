  tsukiji-outer-market: {nombre: Tsukiji Outer Market, gps: '35.664770,139.770252', maps: 'https://www.google.com/maps/search/?api=1&query=35.664770,139.770252', descripcion: 'El mercado exterior que sobrevivió a la mudanza: 400 puestos de tamagoyaki, atún, uni y cuchillos — el desayuno más rico de Tokio es de pie, puesto por puesto.', informacion: 'El mercado nació en 1935 tras el gran terremoto. La subasta de atún se fue a Toyosu en 2018, pero el mercado ''exterior'' — el de a pie — se quedó y está más vivo que nunca.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWnuqMHhe0XYNwC48OdIcds_ZEFoKUKx1e1c2LL5_1MzlUx1XfDL29XtRMSssmflspg6aBXLpJZB_-R1U9Zo9-KrKViUgEkv1MO16POjofWWNpWaM9SQ8Ztd2rBVPcqrkmVLJt_v=w1200-h800', horario: '05:00–14:00; cierra Dom/Mié', horario_fuente: 'https://www.tsukiji.or.jp/english/calendar/'}
  ginza: {nombre: Ginza, gps: '35.671223,139.766486', maps: 'https://www.google.com/maps/search/?api=1&query=35.671223,139.766486', descripcion: 'La milla de oro de Tokio: flagships de 12 pisos, papelerías legendarias (Itoya), galerías y vitrinas que son museos.', informacion: Su nombre viene de la casa de moneda de plata (gin-za) de 1612. Tras el incendio de 1872 se reconstruyó 'a la occidental' y se volvió el escaparate de la modernidad japonesa., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWnO3Pe8CVICucHSPYKQmk3ZKleMQKbj7mNpbjiz4FHOs5_m7aj-RwSqskwf0EiZF5pA7SguYU9OYKhnvbfuCtyNfWazrBnGGu8kX9nVikExquQnzEt4hr15c6CLFHtdtxzGyn4A=w1200-h800'}
