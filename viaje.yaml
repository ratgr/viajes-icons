  senso-ji: {nombre: Sensō-ji, gps: '35.714765,139.796655', maps: 'https://www.google.com/maps/search/?api=1&query=35.714765,139.796655', descripcion: 'El templo más visitado del mundo (~30 millones al año): la puerta Kaminarimon con su farol de 700 kg, la calle Nakamise y el salón de la Kannon dorada.', informacion: 'El templo más antiguo de Tokio: dos pescadores sacaron la estatuilla de Kannon del río en el año 628 y el pueblo le construyó casa. Todo ardió en 1945; se reconstruyó con donativos del país entero.', imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmWJWNHaTcAUu7U1Q91X7PPQs1k1-8Sc22WaIcERJMJ2p5_Jhsag4D3oGRaptnAQByAoeVPiIPXY18Z1aqbAjiGohOOs15Y0nqjCwzxXqd8CrXey7LINrpShW0Si6IkIROedxqN=w1200-h800', horario: '06:00–17:00 (06:30 oct–mar)', horario_fuente: 'https://www.senso-ji.jp/'}
  tokyo-skytree: {nombre: Tokyo Skytree, gps: '35.710063,139.810700', maps: 'https://www.google.com/maps/search/?api=1&query=35.710063,139.810700', descripcion: 'La torre más alta de Japón (634 m): dos miradores, piso de cristal y la base Solamachi llena de tiendas. En día claro: 70 km de vista.', informacion: Terminada en 2012 para la señal digital; 634 se lee 'Mu-sa-shi' — el nombre antiguo de la región. Su sistema antisísmico copia el pilar central flexible de las pagodas de madera., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWlv93feuMKcihbi_RIwlkAaBppFauHqm2ow0ofCs5Qqhr29iv2skw5ui1ogC7l7rrF8zDUzDqGqtLLesHwWJnNrlLfxOmjPrsQ2UBHv_nbQ4gS2xe8mRXEGLlK3ZWDL3mbHRae-=w1200-h800', horario: 'Lun–Sáb 10:00–22:00; Dom y festivos 09:00–22:00', horario_fuente: 'https://en.tokyo-skytree.jp/open-hours/'}
  parque-ueno: {nombre: Parque Ueno, gps: '35.714756,139.773431', maps: 'https://www.google.com/maps/search/?api=1&query=35.714756,139.773431', descripcion: 'El parque-museo de Tokio: museos nacionales, el zoológico con pandas, templos y los lotos del estanque Shinobazu.', informacion: Terreno del gran templo Kan'ei-ji — aquí cayó el último bastión del shogunato en 1868. En 1873 se volvió de los primeros parques públicos de Japón., imagen: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmiIYul8YTz4gIZ7OhgaTcFjiqXsASGkonl6bzxsR-ofIBwMevWaL-0e90oDYKxR4uF2gTeCVbKnCi0rXBoQhoDaMWeC15jgiTKmFwceqiO7mPnFFONr28bVj1Qihywla63vRu9AA=w1200-h800', horario: '05:00–23:00', horario_fuente: 'https://www.kensetsu.metro.tokyo.lg.jp/jimusho/toubuk/ueno/kouenannai'}
